{% extends 'base.html' %}
{% load static %}

{% block title %}Chat with {{ other_user.username }} | NIIT Connect{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/chats/chat.css' %}" />
{% endblock %}

{% block content %}
<div class="chat-wrapper glass-panel">

    <!-- HEADER -->
    <div class="chat-header">
        <a href="{% url 'chat_inbox' %}" class="back-btn">Back</a>
        <h3>{{ other_user.username }}</h3>
    </div>

    <!-- MESSAGES -->
    <div class="chat-messages" id="chatBox"></div>

    <!-- INPUT -->
    <div class="chat-input-area">
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="content" id="messageInput" placeholder="Type message..." required />
            <button type="submit">Send</button>
        </form>
    </div>

</div>
{% endblock %}

{% block extra_js %}
<script>
const chatBox = document.getElementById("chatBox");
const currentUsername = "{{ request.user.username }}";
const csrfToken = "{{ csrf_token }}";
const otherUserId = "{{ other_user.id }}";

// ----------------------
// LOAD MESSAGES
// ----------------------
function loadMessages() {
    fetch(`/chats/messages/${otherUserId}/`)
    .then(res => res.json())
    .then(data => {
            console.log(data);
            chatBox.innerHTML = "";

            data.forEach(msg => {
                const isMe = msg.sender === currentUsername;

                const div = document.createElement("div");
                div.className = `message-row ${isMe ? "sent-row" : "received-row"}`;

                div.innerHTML = `
                    <div class="message-bubble ${isMe ? "sent-bubble" : "received-bubble"}">
                        <p>${msg.content}</p>

                        <div class="message-meta">
                            <span class="message-time">${msg.time}</span>

                            ${msg.edited ? `<span class="edited-label">edited</span>` : ""}
                        </div>

                        ${isMe ? `
                        <div class="message-actions">
                            <button onclick="editMessage(${msg.id})">Edit</button>
                            <button onclick="deleteMessage(${msg.id})">Delete</button>
                        </div>
                        ` : ""}
                    </div>
                `;

                chatBox.appendChild(div);
            });
        });
}

// ----------------------
// DELETE MESSAGE
// ----------------------
function deleteMessage(id) {
    fetch(`/chats/delete/${id}/`, {
        method: "POST",
        headers: {
            "X-CSRFToken": csrfToken
        }
    })
    .then(res => res.json())
    .then(() => {
        loadMessages();
    });
}

// ----------------------
// EDIT MESSAGE
// ----------------------
function editMessage(id) {
    const newText = prompt("Edit message:");

    if (!newText) return;

    fetch(`/chats/edit/${id}/`, {
        method: "POST",
        headers: {
            "X-CSRFToken": csrfToken,
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: `content=${encodeURIComponent(newText)}`
    })
    .then(res => res.json())
    .then(() => {
        loadMessages();
    });
}

// ----------------------
// SEND MESSAGE
// ----------------------
document.querySelector("form").addEventListener("submit", function(e) {
    e.preventDefault();

    const input = document.getElementById("messageInput");

    fetch(window.location.href, {
        method: "POST",
        headers: {
            "X-CSRFToken": csrfToken,
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: `content=${encodeURIComponent(input.value)}`
    }).then(() => {
        input.value = "";
        loadMessages();
    });
});

// initial load + polling
loadMessages();
setInterval(loadMessages, 3000);
</script>
{% endblock %}
