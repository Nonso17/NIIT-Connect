{% extends 'base.html' %}
{% load static %}

{% block title %}Edit User | NIIT Connect{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'dashboard/css/edit_user.css' %}?v=3">
{% endblock %}

{% block content %}
<div class="glass-panel" style="padding: 32px; border-radius: 20px;">
    <h2 class="title" style="margin-top:0; margin-bottom: 24px; color: var(--color-primary-blue-dark);">Edit User</h2>

    {% if messages %}
        {% for message in messages %}
            <p class="message {{ message.tags }}" style="padding: 12px; border-radius: 8px; margin-bottom: 16px;">
                {{ message }}
            </p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="form-group" style="margin-bottom: 16px;">
            <label style="display:block; margin-bottom: 8px; color: var(--color-text-muted);">Username</label>
            <input type="text" name="username" value="{{ user.username }}" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(15, 23, 42, 0.1); background: rgba(255, 255, 255, 0.8);">
        </div>

        <div class="form-group" style="margin-bottom: 16px;">
            <label style="display:block; margin-bottom: 8px; color: var(--color-text-muted);">Email</label>
            <input type="email" name="email" value="{{ user.email }}" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(15, 23, 42, 0.1); background: rgba(255, 255, 255, 0.8);">
        </div>

        <div class="form-group" style="margin-bottom: 16px;">
            <label style="display:block; margin-bottom: 8px; color: var(--color-text-muted);">Phone Number</label>
            <input type="text" name="number" value="{{ profile.number }}" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(15, 23, 42, 0.1); background: rgba(255, 255, 255, 0.8);">
        </div>

        <div class="form-group" style="margin-bottom: 16px;">
            <label style="display:block; margin-bottom: 8px; color: var(--color-text-muted);">Program</label>
            <input type="text" name="program" value="{{ profile.program }}" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(15, 23, 42, 0.1); background: rgba(255, 255, 255, 0.8);">
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
            <label style="display:block; margin-bottom: 8px; color: var(--color-text-muted);">Year</label>
            <input type="text" name="year" value="{{ profile.year }}" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(15, 23, 42, 0.1); background: rgba(255, 255, 255, 0.8);">
        </div>

        <button type="submit" class="btn-primary" style="margin-top: 16px;">Update User</button>
    </form>
</div>
{% endblock %}
