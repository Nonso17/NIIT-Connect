{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User</title>

    <link rel="stylesheet" href="{% static 'dashboard/css/edit_user.css' %}">
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">

      <h2 class="logo">NIIT Connect</h2>

      <ul class="menu">
        <li><a href="{% url 'admin_panel' %}">Dashboard</a></li>
        <li><a href="{% url 'register_user' %}">Register User</a></li>
        <li><a href="{% url 'manage_users' %}">Manage Users</a></li>
        <li><a href="#">Posts</a></li>
        <li><a href="/accounts/logout/">Logout</a></li>
      </ul>

    </aside>


    <!-- Main Content -->
    <div class="container">

        <h2 class="title">Edit User</h2>

        {% if messages %}
            {% for message in messages %}
                <p class="message {{ message.tags }}">
                    {{ message }}
                </p>
            {% endfor %}
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label>Username</label>

                <input 
                    type="text"
                    name="username"
                    value="{{ user.username }}"
                >
            </div>

            <div class="form-group">
                <label>Email</label>

                <input 
                    type="email"
                    name="email"
                    value="{{ user.email }}"
                >
            </div>

            <div class="form-group">
                <label>Phone Number</label>

                <input 
                    type="text"
                    name="number"
                    value="{{ profile.number }}"
                >
            </div>

            <div class="form-group">
                <label>Program</label>

                <input 
                    type="text"
                    name="program"
                    value="{{ profile.program }}"
                >
            </div>

            <div class="form-group">
                <label>Year</label>

                <input 
                    type="text"
                    name="year"
                    value="{{ profile.year }}"
                >
            </div>

            <button type="submit">
                Update User
            </button>

        </form>

    </div>

</body>
</html>
