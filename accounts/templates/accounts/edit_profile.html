{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile</title>

    <link rel="stylesheet" href="{% static 'accounts/css/edit_profile.css' %}">
</head>
<body>
    {% if messages %}

    {% for message in messages %}

        <div class="message {{ message.tags }}">
            {{ message }}
        </div>

    {% endfor %}

    {% endif %}
    
<div class="edit-container">

    <h1>Edit Profile</h1>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <div class="profile-image-section">

            {% if profile.profile_picture %}
                <img src="{{ profile.profile_picture.url }}" class="profile-image">
            {% else %}
                <img src="{% static 'images/default-avatar.png' %}" class="profile-image">
            {% endif %}

        </div>

        <label>Profile Picture</label>
        <input type="file" name="profile_picture">

        <label>First Name</label>
        <input
            type="text"
            name="first_name"
            value="{{ request.user.first_name }}"
        >

        <label>Last Name</label>
        <input
            type="text"
            name="last_name"
            value="{{ request.user.last_name }}"
        >

        <label>Email</label>
        <input
            type="email"
            name="email"
            value="{{ request.user.email }}"
        >

        <label>Phone</label>
        <input
            type="text"
            name="phone"
            value="{{ profile.phone }}"
        >

        <label>Address</label>
        <input
            type="text"
            name="address"
            value="{{ profile.address }}"
        >

        <!-- <label>Bio</label>

        <textarea
            name="bio"
            rows="5"
        >{{ profile.bio }}</textarea> -->

        <button type="submit">
            Save Changes
        </button>

    </form>

</div>

</body>
</html>
