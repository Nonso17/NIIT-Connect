{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>

    <link rel="stylesheet"
          href="{% static 'accounts/css/change_password.css' %}">
</head>
<body>
{% if messages %}
        {% for message in messages %}
            <div class="message">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
<div class="container">

    <h2>Change Temporary Password</h2>

    

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Change Password
        </button>

    </form>

</div>

</body>
</html>
